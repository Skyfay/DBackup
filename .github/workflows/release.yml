# ─── Release ─────────────────────────────────────────────────
# Build multi-arch Docker images and push to GHCR + Docker Hub.
# Triggered on version tags (e.g., v1.0.2, v1.1.0-beta.1).
#
# A tag with a suffix is a preview: `-dev` goes to the channel dev, every other suffix to beta. A
# preview never moves `latest` or the major tag, leaves the CI image and the README on Docker Hub
# alone, and its GitHub release is a pre-release whose notes come from the changelog fragments.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  deployments: write

env:
  GHCR_IMAGE: ghcr.io/skyfay/dbackup
  DOCKERHUB_IMAGE: skyfay/dbackup

jobs:
  # ── Validate first ──────────────────────────────────────────
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      id-token: write

  # ── Release notes ───────────────────────────────────────────
  # Made before anything is built, so a tag without notes stops before it publishes an image. A
  # release takes its block of docs/changelog.md, a preview the changelog fragments, with what came
  # since the beta before it, which needs the tags and the history for the thanks of the fragments.
  notes:
    name: Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/toolbox/index.mjs changelog:notes "$TAG" > release_notes.md
          cat release_notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  # ── Build per-arch images ───────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [validate, notes]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          labels: |
            org.opencontainers.image.description=A self-hosted database backup automation tool for MySQL, PostgreSQL, MongoDB & more. Backup to S3, FTP, or Local Storage.
            org.opencontainers.image.vendor=Skyfay
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,scope=build-${{ matrix.suffix }},mode=max

  # ── Build verification ──────────────────────────────────────
  # Starts the built amd64 image and verifies the app boots
  # successfully as the non-root runtime user. Catches permission
  # issues, missing binaries, and broken migrations before publish.
  build-verification:
    name: Build Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL="file:/data/db/test.db" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:3000 \
            "${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-amd64"

      - name: Wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 30); do
            if curl -sfk https://localhost:3000/api/health > /dev/null 2>&1 || \
               curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start within 30s"
          echo "--- Container logs ---"
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  # ── Create multi-arch manifests ─────────────────────────────
  manifest:
    name: Create Manifests
    runs-on: ubuntu-latest
    needs: build-verification
    environment:
      name: ${{ contains(github.ref_name, '-dev') && 'dev' || contains(github.ref_name, '-') && 'beta' || 'production' }}
      url: https://hub.docker.com/r/skyfay/dbackup/tags
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Every suffix is a preview, so a tag like v4.1.0-beta.1 never becomes latest.
          if [[ "$TAG" == *-dev* ]]; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            MAJOR=$(echo "$TAG" | sed -nE 's/^(v[0-9]+)\..*$/\1/p')
            echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GHCR manifests
        run: |
          TAG="${{ steps.tags.outputs.version }}"
          SRC_AMD64="${{ env.GHCR_IMAGE }}:${TAG}-amd64"
          SRC_ARM64="${{ env.GHCR_IMAGE }}:${TAG}-arm64"

          # Version tag
          docker buildx imagetools create -t "${{ env.GHCR_IMAGE }}:${TAG}" "$SRC_AMD64" "$SRC_ARM64"

          # Channel tags
          CHANNEL="${{ steps.tags.outputs.channel }}"
          if [ "$CHANNEL" = "dev" ]; then
            docker buildx imagetools create -t "${{ env.GHCR_IMAGE }}:dev" "$SRC_AMD64" "$SRC_ARM64"
          elif [ "$CHANNEL" = "beta" ]; then
            docker buildx imagetools create -t "${{ env.GHCR_IMAGE }}:beta" "$SRC_AMD64" "$SRC_ARM64"
          else
            docker buildx imagetools create -t "${{ env.GHCR_IMAGE }}:latest" "$SRC_AMD64" "$SRC_ARM64"
            MAJOR="${{ steps.tags.outputs.major }}"
            if [ -n "$MAJOR" ] && [ "$MAJOR" != "v0" ]; then
              docker buildx imagetools create -t "${{ env.GHCR_IMAGE }}:${MAJOR}" "$SRC_AMD64" "$SRC_ARM64"
            fi
          fi

      - name: Create Docker Hub manifests
        if: vars.DOCKERHUB_USERNAME != ''
        run: |
          TAG="${{ steps.tags.outputs.version }}"
          SRC_AMD64="${{ env.GHCR_IMAGE }}:${TAG}-amd64"
          SRC_ARM64="${{ env.GHCR_IMAGE }}:${TAG}-arm64"

          # Version tag
          docker buildx imagetools create -t "${{ env.DOCKERHUB_IMAGE }}:${TAG}" "$SRC_AMD64" "$SRC_ARM64"

          # Channel tags
          CHANNEL="${{ steps.tags.outputs.channel }}"
          if [ "$CHANNEL" = "dev" ]; then
            docker buildx imagetools create -t "${{ env.DOCKERHUB_IMAGE }}:dev" "$SRC_AMD64" "$SRC_ARM64"
          elif [ "$CHANNEL" = "beta" ]; then
            docker buildx imagetools create -t "${{ env.DOCKERHUB_IMAGE }}:beta" "$SRC_AMD64" "$SRC_ARM64"
          else
            docker buildx imagetools create -t "${{ env.DOCKERHUB_IMAGE }}:latest" "$SRC_AMD64" "$SRC_ARM64"
            MAJOR="${{ steps.tags.outputs.major }}"
            if [ -n "$MAJOR" ] && [ "$MAJOR" != "v0" ]; then
              docker buildx imagetools create -t "${{ env.DOCKERHUB_IMAGE }}:${MAJOR}" "$SRC_AMD64" "$SRC_ARM64"
            fi
          fi

  # ── Build and push CI image ─────────────────────────────────
  # A preview keeps the CI image of the last release, which has a single tag.
  build-ci-image:
    name: Build CI Image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute CI image tags
        id: ci-tags
        run: |
          TAGS="${{ env.GHCR_IMAGE }}:ci"
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:ci"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: ./ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ci-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.description=Lightweight CI helper image for triggering DBackup jobs from CI/CD pipelines.
            org.opencontainers.image.vendor=Skyfay
            org.opencontainers.image.licenses=GPL-3.0-only

  # ── Push README to Docker Hub ───────────────────────────────
  readme:
    name: Push README to Docker Hub
    runs-on: ubuntu-latest
    needs: manifest
    # Docker Hub shows the README of the last release, not of a preview from dev.
    if: vars.DOCKERHUB_USERNAME != '' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@v4

      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: skyfay/dbackup
          readme-filepath: README.md

  # ── Create GitHub Release ───────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: write
    steps:
      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          # A preview never becomes the latest release on GitHub.
          make_latest: ${{ !contains(github.ref_name, '-') }}
