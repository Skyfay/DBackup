# ─── Docker Build ────────────────────────────────────────────
# On a pull request into main, builds the image like the release does, on a
# native runner per platform, without pushing it, then starts it once and
# waits for the health check, like the Build Test of the release. A broken
# image shows up before the merge instead of after the tag.
#
# Its own workflow rather than a job of Validate, since the release calls
# Validate and would list this job as skipped.
#
# One job, Approve, waits for an approval through the environment docker-build,
# whose required reviewers are set in the settings of the repository, and the
# builds wait for Approve. GitHub asks for a review once per job that names the
# environment, so only Approve names it: a run sends one request, not one per
# platform.

name: Docker Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    name: Approve
    environment: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Approved
        run: echo "The builds start now."

  build:
    name: Build (${{ matrix.suffix }})
    needs: approve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dbackup:pr-${{ matrix.suffix }}
          # A pull request reads its own cache from earlier pushes, and writes
          # it under a scope of its own so the release cache stays untouched.
          cache-from: |
            type=gha,scope=build-${{ matrix.suffix }}
            type=gha,scope=pr-build-${{ matrix.suffix }}
          cache-to: type=gha,scope=pr-build-${{ matrix.suffix }},mode=max

      - name: Start container
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL="file:/data/db/test.db" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:3000 \
            "dbackup:pr-${{ matrix.suffix }}"

      - name: Wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 60); do
            if curl -sfk https://localhost:3000/api/health > /dev/null 2>&1 || \
               curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start within 60s"
          echo "--- Container logs ---"
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
