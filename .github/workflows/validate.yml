# ─── Validate ────────────────────────────────────────────────
# Lint, type checking, unit tests and the builds of the docs and the website
# run in parallel.
# A quality gate on every pull request into main or dev, and called by the
# release workflow on tags. A pull request into main also builds the Docker
# image for both platforms and starts it once approved, so a broken image
# shows up before the merge instead of after the tag.

name: Validate

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm type

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cd docs && pnpm install --frozen-lockfile
      - run: pnpm docs:build

  website-build:
    name: Website Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # ── Docker build ────────────────────────────────────────────
  # Only on a pull request into main. Builds the image like the release does,
  # on a native runner per platform, without pushing it, then starts it once
  # and waits for the health check, like the Build Test of the release.
  # Waits for an approval through the environment docker-build, whose required
  # reviewers are set in the settings of the repository, so a push that only
  # changes a workflow or the docs does not cost two image builds.
  docker-build:
    name: Docker Build (${{ matrix.suffix }})
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    environment: docker-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dbackup:pr-${{ matrix.suffix }}
          # A pull request reads its own cache from earlier pushes, and writes
          # it under a scope of its own so the release cache stays untouched.
          cache-from: |
            type=gha,scope=build-${{ matrix.suffix }}
            type=gha,scope=pr-build-${{ matrix.suffix }}
          cache-to: type=gha,scope=pr-build-${{ matrix.suffix }},mode=max

      - name: Start container
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL="file:/data/db/test.db" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:3000 \
            "dbackup:pr-${{ matrix.suffix }}"

      - name: Wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 60); do
            if curl -sfk https://localhost:3000/api/health > /dev/null 2>&1 || \
               curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start within 60s"
          echo "--- Container logs ---"
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
