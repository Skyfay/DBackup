# ─── End-to-End Tests ───────────────────────────────────────
# Builds the image of the pull request and runs the Playwright tests of e2e/ against it, with
# the services of the dev lab on the runner itself: DBackup and every server it backs up in one
# Compose project, as `pnpm test:e2e` runs them on a developer machine.
#
# One job, Approve, waits for an approval through the environment e2e, whose required reviewers
# are set in the settings of the repository, like the Docker Build does with docker-build. Until
# the environment has a reviewer, GitHub runs the tests without asking.
#
# Every family of e2e/support/targets.ts is a job of the matrix, and so are the browser tests,
# so each job pulls only the images it needs. The first start runs in every job.

name: End-to-End Tests

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    name: Approve
    environment: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Approved
        run: echo "The end-to-end tests start now."

  e2e:
    name: E2E (${{ matrix.family }})
    needs: approve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [ui, postgres, mysql, mongodb, mssql, small, customer, storage]
    env:
      CI: "true"
      E2E_FAMILIES: ${{ matrix.family }}
      E2E_NO_BUILD: "1"
      # The runner is thrown away anyway, and the logs of DBackup are wanted after a failure.
      E2E_KEEP: "1"
    steps:
      # The image, its build cache and the images of the family take more than the free space of
      # a runner leaves, SQL Server alone pulls 4 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dbackup-e2e:local
          cache-from: |
            type=gha,scope=build-amd64
            type=gha,scope=e2e-build
          cache-to: type=gha,scope=e2e-build,mode=max

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Logs of the containers
        if: failure()
        run: mkdir -p e2e/test-results && docker compose -p dbackup-lab logs --no-color > e2e/test-results/containers.log 2>&1 || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.family }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
